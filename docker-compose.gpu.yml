# NVIDIA graphics card (Windows with WSL 2, or Linux with the NVIDIA Container Toolkit):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile ai up
# Not for Macs: Docker on macOS can't use the Mac's graphics chip. Use the CPU setup there, or run natively.

services:
  photo-cleaner:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu126
    image: photo-cleaner:gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
