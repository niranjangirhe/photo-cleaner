# Start:   docker compose up            then open http://127.0.0.1:8770
# With the optional AI second opinion (Qwen through Ollama, about 6 GB more):
#          docker compose --profile ai up
#
# Point PHOTOS at the folder with your unzipped Google Takeout, in a .env file next to this one
# (see .env.example) or on the command line:  PHOTOS=/path/to/Takeout docker compose up
# The folder is shared read-only: the app can never change your photos.

services:
  photo-cleaner:
    build: .
    image: photo-cleaner
    ports:
      - "127.0.0.1:8770:8770"         # only reachable from this computer
    volumes:
      - "${PHOTOS:-./input}:/photos:ro"
      - photo-cleaner-data:/data      # results, previews, face crops
      - photo-cleaner-models:/models  # downloaded models (~5 GB), kept between runs
    environment:
      OLLAMA_URL: "${OLLAMA_URL:-http://ollama:11434}"
      CLEANER_OLLAMA_WAIT: "30"       # give the Ollama container time to start
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.13
    profiles: ["ai"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  photo-cleaner-data:
  photo-cleaner-models:
  ollama-models:
