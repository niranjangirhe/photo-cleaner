# Start:   docker compose up            then open http://127.0.0.1:8770
# With an NVIDIA graphics card, use nvidia.yml instead:   docker compose -f nvidia.yml up
#
# Your photos: unzip your Google Takeout into the "input" folder next to this file, or point PHOTOS at
# another folder in a .env file (see .env.example). The folder is shared read-only: the app can never
# change your photos.

# A fixed name: Docker's storage is named after the project, not the folder, so renaming or moving
# this folder keeps your downloaded models and results.
name: photo-cleaner

services:
  photo-cleaner:
    build: .
    image: photo-cleaner
    pull_policy: build                # built on your computer, never downloaded from Docker Hub
    ports:
      - "127.0.0.1:8770:8770"         # only reachable from this computer
    volumes:
      - "${PHOTOS:-./input}:/photos:ro"
      - data:/data                    # results, previews, face crops
      - models:/models                # downloaded models (~5 GB), kept between runs
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"       # optional: a Hugging Face token makes the first download faster
    restart: unless-stopped

volumes:
  data:
  models:
